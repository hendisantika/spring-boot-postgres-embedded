version: 2
updates:
  # Maven dependencies (pom.xml)
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Asia/Jakarta"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "java"
    commit-message:
      prefix: "build"
      include: "scope"
    groups:
      spring-boot:
        patterns:
          - "org.springframework.boot*"
      embedded-postgres:
        patterns:
          - "io.zonky.test*"
      mapstruct:
        patterns:
          - "org.mapstruct*"
      maven-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
        exclude-patterns:
          - "org.springframework.boot*"
          - "io.zonky.test*"
          - "org.mapstruct*"
    ignore:
      # Stay on stable releases; skip milestones/RCs pulled in by "latest"
      - dependency-name: "*"
        versions:
          - "*-M*"
          - "*-RC*"
          - "*.Beta*"
          - "*-rc-*"
          - "*-beta-*"
          - "*-alpha-*"

  # GitHub Actions used in workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Asia/Jakarta"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci"
    groups:
      github-actions:
        patterns:
          - "*"
